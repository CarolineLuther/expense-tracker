name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Hämta koden
        uses: actions/checkout@v5

      - name: Sätt upp Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Bygg
        run: ./mvnw -B -DskipTests package

      - name: Kör enhetstester
        run: ./mvnw -B test -Dtest='*ServiceTest'

      - name: Kör integrationstester
        run: ./mvnw -B test -Dtest='*IntegrationTest'

      - name: Deploya till Render
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"