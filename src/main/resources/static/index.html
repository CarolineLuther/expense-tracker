<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <title>Utgiftsspårare</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<h1>Expense Tracker</h1>

<form id="expense-form">
    <input type="text" id="description" placeholder="Beskrivning" required>
    <input type="number" id="amount" placeholder="Belopp" step="0.01" min="0.01" required>
    <select id="category" required>
        <option value="FOOD">Mat</option>
        <option value="TRANSPORT">Transport</option>
        <option value="ENTERTAINMENT">Nöje</option>
        <option value="HOUSING">Boende</option>
        <option value="OTHER">Övrigt</option>
    </select>
    <input type="date" id="date" required>
    <button type="submit" id="add-button">Lägg till</button>
</form>

<section id="summary">
    <h2>Summering</h2>
    <ul id="summary-list"></ul>
    <p>Totalt: <span id="total-sum">0</span> kr</p>
</section>

<section>
    <h2>Utgifter</h2>
    <ul id="expense-list"></ul>
</section>

<script src="app.js"></script>
</body>
</html>
